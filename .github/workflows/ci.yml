name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be triggered by hand from the Actions tab, which is how you check a
  # workflow change without pushing to main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Windows runners default to PowerShell, which would make the matrix three different
    # shells running the same steps. Git Bash ships on the Windows image, so this keeps
    # every platform executing identically.
    shell: bash

env:
  # electron-builder otherwise hunts for a signing identity on macOS and fails the job.
  # Unpacked builds are never shipped, so there is nothing to sign.
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm audit --prod --audit-level=high

  build:
    name: Build (${{ matrix.os }})
    # Gated on verify so three matrix jobs do not spend runner time on a typo.
    needs: verify
    strategy:
      # One platform failing should not hide the state of the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm run check:native
      - run: pnpm run test:electron
      # Compiles main, preload and renderer. Catches path-separator and filename-case
      # bugs that a single dev machine never sees.
      - run: pnpm run vite:build:app
      # `--dir` produces an unpacked app and skips every packaging target, so no
      # installers, no signing, and no snapcraft on the Linux runner.
      - run: pnpm run electron:build:dir
      - name: Desktop flows (Windows and macOS)
        if: runner.os != 'Linux'
        run: pnpm exec playwright test
      - name: Desktop flows (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec playwright test
      - name: Packaged persistence (Windows and macOS)
        if: runner.os != 'Linux'
        run: pnpm run test:packaged
      - name: Packaged persistence (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:packaged
